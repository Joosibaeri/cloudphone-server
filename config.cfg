# EN: CloudPhone server configuration. / DE: CloudPhone-Serverkonfiguration.
# EN: base_dir = directory for base qcow2. / DE: base_dir = Verzeichnis fuer Basis-qcow2.
# EN: base_image_url = URL for base qcow2 if missing. / DE: base_image_url = URL fuer Basis-qcow2.
# EN: ip_mode = ipv4 or ipv6 (SSH hostfwd binding). / DE: ip_mode = ipv4 oder ipv6 (SSH-Hostfwd).
base_dir=/userdata/base
base_image_url=https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
ip_mode=ipv6
